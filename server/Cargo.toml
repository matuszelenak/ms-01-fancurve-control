[package]
name = "fancurve"
version = "0.1.0"
edition = "2021"
description = "Fan curve controller for MinisForum MS-01"
license = "Unlicense"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = "8"
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[profile.release]
lto = true
strip = true

[package.metadata.deb]
name = "fancurve"
maintainer = "Matus Zelenak <Matus.Zelenak@swan.sk>"
copyright = "2026, Matus Zelenak"
license-file = ["../LICENSE", "0"]
extended-description = """\
Background service with a web UI for controlling the chassis fans of a \
MinisForum MS-01. Reads CPU temperatures from hwmon sysfs, drives the fans \
through the nct6798 Super I/O chip following a user-editable fan curve, and \
serves the Svelte frontend on port 8090."""
section = "admin"
priority = "optional"
# smartctl is used for NVMe model names (sysfs fallback exists)
recommends = "smartmontools"
assets = [
    ["target/release/fancurve", "usr/bin/fancurve", "755"],
    ["../README.md", "usr/share/doc/fancurve/README.md", "644"],
    ["../LICENSE", "usr/share/doc/fancurve/LICENSE", "644"],
]
maintainer-scripts = "debian"
systemd-units = { unit-name = "fancurve", enable = true, start = true }
